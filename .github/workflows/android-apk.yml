name: Build FlowPass Mobile APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate FlowPass 1.5 source
        run: |
          set -euo pipefail
          unzip -q FlowPass-1.5.0-Royal-Studio-Source.zip -d "$RUNNER_TEMP/flowpass15"
          SOURCE_DIR="$RUNNER_TEMP/flowpass15/-FlowPass-main"
          test -f "$SOURCE_DIR/app/src/main/java/com/flowpass/mobile/MainActivity.kt"
          test -f "$SOURCE_DIR/app/src/main/assets/flowpass.user.js"
          rsync -a --exclude='.github/' "$SOURCE_DIR/" ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md build.gradle.kts gradle.properties settings.gradle.kts app/
          if ! git diff --cached --quiet; then
            git commit -m "Integrate FlowPass 1.5 Royal Studio source"
            git push origin HEAD:main
          fi
      - name: Verify app version
        run: |
          grep -n 'versionName = "1.5.0"' app/build.gradle.kts
          grep -n 'versionCode' app/build.gradle.kts
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build FlowPass 1.5 debug APK
        run: gradle --no-daemon clean assembleDebug
      - name: Upload FlowPass 1.5 APK
        uses: actions/upload-artifact@v4
        with:
          name: FlowPass-Mobile-1.5.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
